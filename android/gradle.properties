org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# WINDOWS ONLY - delete this line once development has moved to macOS.
#
# Kotlin cannot close its incremental caches for the tapsell_mediation module
# under a Windows path containing a space and a dot, and the build fails with
# "Could not close incremental caches in ...\tapsell_mediation\...". Turning
# incremental compilation off costs a few seconds on one small plugin.
#
# macOS does not lock files this way, so on the Mac this line only makes builds
# slower. Removing it there is verified by a clean `flutter build apk --debug`.
kotlin.incremental=false
