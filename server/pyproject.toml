[project]
name = "spy-server"
version = "1.0.0"
description = "Word packs and version checks for the Spy party game."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

# `app` is the package. `tool` is scripts run by hand and `content` is data, so
# without this setuptools finds three top-level directories, cannot guess which
# one is the distribution, and refuses to build at all. It only stayed hidden
# because the existing virtualenv predates both of the other two.
[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
